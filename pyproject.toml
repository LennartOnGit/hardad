[project]
name = "hardad"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "anthropic>=0.52,<1",
    "sqlalchemy>=2,<3",
    "psycopg[binary]>=3,<4",
    "jinja2>=3,<4",
    "python-multipart>=0.0.20,<1",
    "pydantic-settings>=2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "httpx>=0.28,<1",
]
