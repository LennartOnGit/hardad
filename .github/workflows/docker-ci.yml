name: Build, sign, and scan

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      # 1. Checkout the code.
      - name: Checkout
        uses: actions/checkout@v4
    
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
    
      # 2. Set up BuildKit with the docker-container driver.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      
      # 3. Log in to Docker Hub.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Compute tags and labels from git metadata.
      # Produces the rolling :hardened tag plus :hardened-<sha>.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: lennartondocker/hardad
          tags: |
            type=raw,value=hardened
            type=sha,prefix=hardened-
    
      # 5. Build, attest, push 
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: Dockerfile_hardened
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      # 6. Install cosign on the runner.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        
      # 7. Sign by DIGEST.
      # GitHub OIDC token from the environment
      - name: Sign image
        if: github.event_name == 'push'
        run: |
          cosign sign --yes lennartondocker/hardad@${{ steps.build.outputs.digest }}
    
      - name: Wait for Scout indexing
        run: sleep 60
    
      # 8. Scout policy evaluation.
      - name: Scout policy evaluation
        uses: docker/scout-action@v1
        with:
          command: policy
          organization: lennartondocker
          image: lennartondocker/hardad@${{ steps.build.outputs.digest }}