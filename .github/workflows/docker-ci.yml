name: Build, sign, and scan

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      # 1. Checkout the code.
      - name: Checkout
        uses: actions/checkout@v4

      # 1a. Run the test suite before spending build/scan budget.
      - name: Run test suite
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install project
        run: uv sync --frozen

      - name: Run tests
        env:
          # app.config.Settings requires these at import time (Field(...)).
          ANTHROPIC_API_KEY: test-key-not-used-by-tests
          ADMIN_TOKEN: test-admin-token-not-used-by-tests
        run: uv run pytest -q

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 2. Set up BuildKit with the docker-container driver.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      
      # 3. Log in to Docker Hub.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Compute tags and labels from git metadata.
      # Produces the rolling :hardened tag plus :hardened-<sha>.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: lennartondocker/hardad
          tags: |
            type=raw,value=hardened
            type=sha,prefix=hardened-

      # 4a. Resolve the DHI base image digest       
      - name: Resolve base image digest
        id: base
        run: |
          DIGEST=$(docker buildx imagetools inspect dhi.io/python:3.13 \
                    --format '{{ .Manifest.Digest }}')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "dhi.io/python:3.13 -> $DIGEST"

      # 5. Build, attest, push
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: Dockerfile_hardened
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: |
            manifest:org.opencontainers.image.base.name=dhi.io/python:3.13
            manifest:org.opencontainers.image.base.digest=${{ steps.base.outputs.digest }}
          sbom: true
          provenance: mode=max

      # 6. Install cosign on the runner.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        
      # 7. Sign by DIGEST.
      # GitHub OIDC token from the environment
      - name: Sign image
        if: github.event_name == 'push'
        run: |
          cosign sign --yes lennartondocker/hardad@${{ steps.build.outputs.digest }}
    
      - name: Wait for Scout indexing
        run: sleep 60
    
      # 8. Scout policy evaluation.
      - name: Scout policy evaluation
        uses: docker/scout-action@v1
        with:
          command: policy
          organization: lennartondocker
          image: lennartondocker/hardad@${{ steps.build.outputs.digest }}