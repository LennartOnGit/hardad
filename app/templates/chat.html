<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Härdad — Swedish tutor</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ request.scope.get('root_path', '') }}/static/styles.css" />

<!--
  Tweak-config: see presentation.jsx for the editable slide content. The
  EDITMODE-BEGIN/END markers are picked up by the design tool when the page
  is opened inside an edit-mode iframe; they're harmless noise otherwise.
-->
<script type="application/json" id="tweak-config">/*EDITMODE-BEGIN*/{
  "annotations": false,
  "showPresentation": true
}/*EDITMODE-END*/</script>

<!--
  Expose the app root path so fetch() calls work identically whether the app
  is served at / or under /docker_demo behind the reverse proxy.
-->
<script>
  window.HARDAD = {
    rootPath: {{ (request.scope.get('root_path') or '') | tojson }},
    userName: {{ user_name | tojson }}
  };
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
</head>
<body>
<div id="root">
  <div style="padding:80px;text-align:center;color:#A4A9C9;font-family:system-ui;">
    Laddar Härdad…
  </div>
</div>

<script type="text/babel" data-presets="env,react" src="{{ request.scope.get('root_path', '') }}/static/chat.jsx"></script>
<script type="text/babel" data-presets="env,react" src="{{ request.scope.get('root_path', '') }}/static/presentation.jsx"></script>

<script type="text/babel" data-presets="env,react">
{% raw %}
const { useState, useEffect } = React;

function App() {
  const rawCfg = document.getElementById("tweak-config").textContent
    .replace(/\/\*EDITMODE-BEGIN\*\//g, "")
    .replace(/\/\*EDITMODE-END\*\//g, "");
  const defaults = JSON.parse(rawCfg);
  const [annotations, setAnnotations] = useState(defaults.annotations);
  const [showPres, setShowPres] = useState(defaults.showPresentation);
  const [editMode, setEditMode] = useState(false);

  // Edit-mode protocol — the design tool posts messages in/out of its iframe.
  useEffect(() => {
    const onMsg = (e) => {
      const d = e.data || {};
      if (d.type === "__activate_edit_mode") setEditMode(true);
      else if (d.type === "__deactivate_edit_mode") setEditMode(false);
    };
    window.addEventListener("message", onMsg);
    window.parent.postMessage({ type: "__edit_mode_available" }, "*");
    return () => window.removeEventListener("message", onMsg);
  }, []);

  const persist = (edits) => {
    window.parent.postMessage({ type: "__edit_mode_set_keys", edits }, "*");
  };

  return (
    <>
      <window.Chat annotations={annotations} />

      {showPres && (
        <>
          <div className="divider"></div>
          <window.Presentation />
        </>
      )}

      <button
        className={"annot-toggle " + (annotations ? "active" : "")}
        onClick={() => setAnnotations(a => !a)}
        title="Toggle feature annotation hotspots"
      >
        <span className="annot-dot"/>
        {annotations ? "Hide feature notes" : "Show feature notes"}
      </button>

      {editMode && (
        <div className="tweaks-panel open" style={{bottom: 70}}>
          <h4>Tweaks</h4>
          <div className="tweak-row">
            <label>Feature annotations</label>
            <button onClick={() => { setAnnotations(a => !a); persist({ annotations: !annotations }); }}>
              {annotations ? "on" : "off"}
            </button>
          </div>
          <div className="tweak-row">
            <label>Presentation section</label>
            <button onClick={() => { setShowPres(s => !s); persist({ showPresentation: !showPres }); }}>
              {showPres ? "visible" : "hidden"}
            </button>
          </div>
        </div>
      )}
    </>
  );
}

// The Chat/Presentation components register themselves on `window` by the
// time this script runs (Babel executes scripts in document order).
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
{% endraw %}
</script>
</body>
</html>
