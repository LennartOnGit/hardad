<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Härdad — Svensklärare</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }
        h1 { text-align: center; padding: 12px; font-size: 1.2rem; color: #a0a0d0; }
        #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
        .msg { max-width: 75%; padding: 10px 14px; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; }
        .msg.user { align-self: flex-end; background: #16213e; }
        .msg.assistant { align-self: flex-start; background: #0f3460; }
        .msg.error { align-self: center; background: #5c1a1a; color: #ff9999; }
        .msg.pending { align-self: flex-start; background: #0f3460; opacity: 0.6; }
        #chat-form { display: flex; gap: 8px; padding: 12px 16px; background: #16213e; }
        #chat-form textarea { flex: 1; resize: none; padding: 10px; background: #1a1a2e; color: #e0e0e0; border: 1px solid #444; border-radius: 8px; font-family: inherit; font-size: 1rem; rows: 2; }
        #chat-form button { padding: 10px 20px; background: #0f3460; color: #e0e0e0; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; }
        #chat-form button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <h1>Härdad</h1>
    <div id="messages">
        {% for msg in messages %}
        <div class="msg {{ msg.role }}">{{ msg.content }}</div>
        {% endfor %}
    </div>
    <form id="chat-form">
        <textarea id="input" rows="2" placeholder="Skriv något på svenska..."></textarea>
        <button type="submit">Skicka</button>
    </form>
    <script>
        const SESSION_ID_INIT = {{ session_id | tojson }};
    </script>
    <script src="{{ request.scope.get('root_path', '') }}/static/chat.js"></script>
</body>
</html>
