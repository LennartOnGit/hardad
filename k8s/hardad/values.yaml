replicaCount: 2

image:
  repository: lennartondocker/hardad
  tag: hardened
  pullPolicy: Always

service:
  type: NodePort
  port: 8000
  nodePort: 30080

ingress:
  enabled: false

env:
  ROOT_PATH: /docker_demo
  LOG_LEVEL: INFO
  HISTORY_RETENTION_TURNS: "50"

# Keys here must match the secretKeyRefs in templates/deployment.yaml.
# Secret creation is kubectl-side (not Helm-managed); see README §"Kubernetes
# Secret" for the create-secret command.
secrets:
  ANTHROPIC_API_KEY: ""
  ADMIN_TOKEN: ""
  DATABASE_URL: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  liveness:
    path: /docker_demo/healthz
    port: 8000
  readiness:
    path: /docker_demo/healthz
    port: 8000